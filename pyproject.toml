[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "yaysafe"
version = "0.1.0"
description = "Experimental security review wrapper for yay and AUR packages"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "yaysafe contributors" }]
keywords = ["arch-linux", "aur", "yay", "security", "pkgbuild"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["mypy>=1.10,<3", "pytest>=8,<10", "ruff>=0.6,<1"]

[project.scripts]
yaysafe = "yaysafe.cli:main"

[project.urls]
Homepage = "https://github.com/crsgmi/yaysafe"
Documentation = "https://github.com/crsgmi/yaysafe#readme"
Issues = "https://github.com/crsgmi/yaysafe/issues"
Source = "https://github.com/crsgmi/yaysafe"

[tool.setuptools.packages.find]
include = ["yaysafe*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
ignore = ["TRY004"] # Protocol validation consistently reports invalid values as ValueError.

[tool.mypy]
python_version = "3.11"
strict = true
